<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Search Receipt</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container mx-auto px-4 pt-28 pb-12">
        <div class="max-w-md mx-auto">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-search text-4xl text-green-500"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Find Your Booking</h1>
                <p class="text-gray-600">Enter your receipt number to view booking details</p>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span th:text="${error}">Error</span>
            </div>

            <!-- Search Form -->
            <div class="bg-white rounded-xl shadow-lg p-8">
                <form th:action="@{/booking/search/receipt}" method="get">
                    <div class="mb-6">
                        <label class="block text-gray-700 font-medium mb-2">Receipt Number</label>
                        <input type="text" name="receiptNumber" required
                               placeholder="e.g., CHK-20260301-A1B2"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-center text-lg font-mono">
                        <p class="text-gray-500 text-sm mt-2 text-center">
                            Your receipt number was provided after booking
                        </p>
                    </div>

                    <button type="submit" 
                            class="w-full bg-green-500 text-white py-3 rounded-lg font-semibold hover:bg-green-600 transition">
                        <i class="fas fa-search mr-2"></i> Search Booking
                    </button>
                </form>
            </div>

            <!-- Help Text -->
            <div class="mt-6 text-center text-gray-500 text-sm">
                <p>Can't find your receipt number?</p>
                <p>Contact us for assistance</p>
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-8">
                <a href="/" class="text-green-600 hover:text-green-700 font-medium">
                    <i class="fas fa-arrow-left mr-2"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
