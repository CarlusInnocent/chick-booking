<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Catalog</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container mx-auto px-4 pt-28 pb-12">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-4">
            Our Chick Breeds
        </h1>
        <p class="text-center text-gray-600 mb-12 max-w-2xl mx-auto">
            Browse our selection of quality baby chicks. All breeds are healthy, vaccinated, and ready for your farm or backyard.
        </p>

        <!-- Chick Grid -->
        <div class="grid md:grid-cols-3 lg:grid-cols-4 gap-6" th:if="${not #lists.isEmpty(chicks)}">
            <div th:each="chick : ${chicks}" class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-xl transition group">
                <div class="h-40 overflow-hidden">
                    <img th:src="@{/images/chicks.jpeg}" alt="Baby Chicks" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                </div>
                <div class="p-5">
                    <h3 class="text-lg font-semibold text-gray-800" th:text="${chick.breed}">Breed Name</h3>
                    <p class="text-gray-600 text-sm mt-2 line-clamp-2" th:text="${chick.description ?: 'Quality day-old chick'}">Description</p>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xl font-bold text-green-600" th:text="'UGX ' + ${#numbers.formatInteger(chick.price, 0, 'COMMA')} + '/chick'">UGX 0/chick</span>
                    </div>
                    <a href="/booking/new" class="mt-3 block text-center bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition">
                        Book This Breed
                    </a>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(chicks)}" class="text-center py-20">
            <img th:src="@{/images/chicks.jpeg}" alt="Chicks" class="w-40 h-40 object-cover rounded-full mx-auto">
            <h2 class="text-2xl font-semibold text-gray-800 mt-6">No Chicks Available Yet</h2>
            <p class="text-gray-600 mt-2">Check back soon for new arrivals!</p>
        </div>

        <!-- Book Now CTA -->
        <div class="mt-12 text-center" th:if="${not #lists.isEmpty(chicks)}">
            <a href="/booking/new" class="inline-block bg-green-500 text-white px-8 py-3 rounded-lg font-semibold hover:bg-green-600 transition shadow-lg">
                <i class="fas fa-shopping-cart mr-2"></i> Start Booking
            </a>
        </div>
    </div>
</main>
</body>
</html>
