<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Chick Breeds</title>
</head>
<body>
<h1 layout:fragment="pageTitle">Chick Breeds</h1>
<main layout:fragment="content">
    <!-- Messages -->
    <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}">Success</span>
    </div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}">Error</span>
    </div>

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <p class="text-gray-600">Manage available chick breeds for booking</p>
        <div class="flex items-center gap-2">
            <a href="/admin/export/chicks" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                <i class="fas fa-download mr-2"></i> Export PDF
            </a>
            <a href="/admin/chicks/new" class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition">
                <i class="fas fa-plus mr-2"></i> Add Breed
            </a>
        </div>
    </div>

    <!-- Chicks Grid -->
    <div th:if="${#lists.isEmpty(chicks)}" class="bg-white rounded-xl shadow p-12 text-center text-gray-500">
        <span class="text-6xl">🐣</span>
        <p class="text-xl mt-4">No chick breeds yet</p>
        <a href="/admin/chicks/new" class="text-yellow-600 hover:underline mt-2 inline-block">Add your first breed</a>
    </div>

    <div th:if="${not #lists.isEmpty(chicks)}" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="chick : ${chicks}" class="bg-white rounded-xl shadow overflow-hidden">
            <div th:class="${'h-32 flex items-center justify-center ' + (chick.active ? 'bg-gradient-to-br from-yellow-200 to-orange-200' : 'bg-gray-200')}">
                <span class="text-6xl" th:class="${chick.active ? '' : 'opacity-50'}">🐥</span>
            </div>
            <div class="p-4">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-lg font-semibold text-gray-800" th:text="${chick.breed}">Breed</h3>
                    <span th:if="${chick.active}" class="bg-green-100 text-green-800 px-2 py-0.5 rounded-full text-xs">Active</span>
                    <span th:unless="${chick.active}" class="bg-red-100 text-red-800 px-2 py-0.5 rounded-full text-xs">Inactive</span>
                </div>
                <p class="text-gray-600 text-sm line-clamp-2" th:text="${chick.description ?: 'No description'}">Description</p>
                <p class="text-xl font-bold text-yellow-600 mt-2" th:text="${'UGX ' + chick.price}">UGX 0.00</p>
                
                <div class="flex items-center justify-between mt-4 pt-4 border-t">
                    <div class="flex items-center space-x-2">
                        <a th:href="@{/admin/chicks/{id}/edit(id=${chick.id})}" 
                           class="text-yellow-600 hover:text-yellow-800 p-2" title="Edit">
                            <i class="fas fa-edit"></i>
                        </a>
                        <form th:action="@{/admin/chicks/{id}/toggle-active(id=${chick.id})}" method="post" class="inline">
                            <button type="submit" class="text-blue-600 hover:text-blue-800 p-2" 
                                    th:title="${chick.active ? 'Deactivate' : 'Activate'}">
                                <i th:class="${chick.active ? 'fas fa-toggle-on' : 'fas fa-toggle-off'}"></i>
                            </button>
                        </form>
                        <form th:action="@{/admin/chicks/{id}/delete(id=${chick.id})}" method="post" class="inline"
                              onsubmit="return confirm('Are you sure you want to delete this breed?')">
                            <button type="submit" class="text-red-600 hover:text-red-800 p-2" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
