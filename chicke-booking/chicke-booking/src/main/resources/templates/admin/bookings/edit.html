<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Edit Booking</title>
</head>
<body>
<h1 layout:fragment="pageTitle" th:text="${'Edit Booking #' + booking.id}">Edit Booking</h1>
<main layout:fragment="content">
    <!-- Error Message -->
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}">Error</span>
    </div>

    <div class="bg-white rounded-xl shadow p-6">
        <form th:action="@{/admin/bookings/{id}/update(id=${booking.id})}" method="post">
            <!-- Customer Information -->
            <div class="mb-8">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 pb-2 border-b">
                    <i class="fas fa-user mr-2 text-yellow-500"></i> Customer Information
                </h2>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Full Name *</label>
                        <input type="text" name="customerName" required th:value="${booking.customerName}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Phone *</label>
                        <input type="tel" name="phone" required th:value="${booking.phone}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-gray-700 font-medium mb-2">Location *</label>
                        <input type="text" name="location" required th:value="${booking.location}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Pickup Date *</label>
                        <input type="date" name="pickupDate" required th:value="${booking.pickupDate}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Status *</label>
                        <select name="status" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" 
                                    th:selected="${s == booking.status}">Status</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-gray-700 font-medium mb-2">Notes</label>
                        <textarea name="notes" rows="3"
                                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
                                  th:text="${booking.notes}"></textarea>
                    </div>
                </div>
            </div>

            <!-- Order Items (Read Only) -->
            <div class="mb-8">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 pb-2 border-b">
                    <i class="fas fa-shopping-cart mr-2 text-yellow-500"></i> Order Items (Read Only)
                </h2>
                <div class="border rounded-lg overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr class="text-left text-gray-600 text-sm">
                                <th class="px-4 py-3">Breed</th>
                                <th class="px-4 py-3">Unit Price</th>
                                <th class="px-4 py-3">Quantity</th>
                                <th class="px-4 py-3 text-right">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${booking.items}" class="border-t">
                                <td class="px-4 py-3">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xl">🐥</span>
                                        <span th:text="${item.chick.breed}">Breed</span>
                                    </div>
                                </td>
                                <td class="px-4 py-3" th:text="${'$' + item.unitPrice}">$0</td>
                                <td class="px-4 py-3" th:text="${item.quantity}">0</td>
                                <td class="px-4 py-3 text-right font-medium" th:text="${'$' + item.subtotal}">$0</td>
                            </tr>
                        </tbody>
                        <tfoot class="bg-gray-50">
                            <tr class="border-t">
                                <td colspan="3" class="px-4 py-3 text-right font-semibold">Total:</td>
                                <td class="px-4 py-3 text-right text-lg font-bold text-yellow-600" 
                                    th:text="${'$' + booking.totalAmount}">$0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex justify-end space-x-4">
                <a th:href="@{/admin/bookings/{id}(id=${booking.id})}" 
                   class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition">
                    <i class="fas fa-save mr-2"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
