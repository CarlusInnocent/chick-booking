<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Bookings</title>
</head>
<body>
<h1 layout:fragment="pageTitle">Bookings</h1>
<main layout:fragment="content">
    <!-- Success/Error Messages -->
    <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}">Success</span>
    </div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}">Error</span>
    </div>

    <!-- Filters & Actions -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-4">
                <!-- Status Filter -->
                <form th:action="@{/admin/bookings}" method="get" class="flex items-center gap-2">
                    <select name="status" class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-yellow-500">
                        <option value="">All Status</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" 
                                th:selected="${s == selectedStatus}">Status</option>
                    </select>
                    <button type="submit" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300">
                        Filter
                    </button>
                </form>

                <!-- Search (Customer Name or Receipt Number) -->
                <form th:action="@{/admin/bookings}" method="get" class="flex items-center gap-2">
                    <input type="text" name="search" th:value="${search}" placeholder="Search by name or receipt #..."
                           class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-yellow-500 w-64">
                    <button type="submit" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
            </div>

            <div class="flex items-center gap-2">
                <!-- Export PDF -->
                <a th:href="@{/admin/export/bookings{status}(status=${selectedStatus != null ? '/status/' + selectedStatus : ''})}" 
                   class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                    <i class="fas fa-download mr-2"></i> Export PDF
                </a>
                <a href="/admin/bookings/new" class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition">
                    <i class="fas fa-plus mr-2"></i> New Booking
                </a>
            </div>
        </div>
    </div>

    <!-- Bookings Table -->
    <div class="bg-white rounded-xl shadow overflow-hidden">
        <div th:if="${#lists.isEmpty(bookings)}" class="text-center py-12 text-gray-500">
            <i class="fas fa-inbox text-5xl mb-4"></i>
            <p class="text-xl">No bookings found</p>
        </div>

        <table th:if="${not #lists.isEmpty(bookings)}" class="w-full">
            <thead class="bg-gray-50">
                <tr class="text-left text-gray-600 text-sm">
                    <th class="px-6 py-4">ID</th>
                    <th class="px-6 py-4">Receipt #</th>
                    <th class="px-6 py-4">Customer</th>
                    <th class="px-6 py-4">Location</th>
                    <th class="px-6 py-4">Phone</th>
                    <th class="px-6 py-4">Pickup Date</th>
                    <th class="px-6 py-4">Status</th>
                    <th class="px-6 py-4">Amount</th>
                    <th class="px-6 py-4">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="booking : ${bookings}" class="border-t hover:bg-gray-50">
                    <td class="px-6 py-4">
                        <a th:href="@{/admin/bookings/{id}(id=${booking.id})}" 
                           class="text-yellow-600 hover:underline font-medium"
                           th:text="${'#' + booking.id}">#1</a>
                    </td>
                    <td class="px-6 py-4 font-mono text-sm text-gray-600" th:text="${booking.receiptNumber}">CHK-XXX</td>
                    <td class="px-6 py-4" th:text="${booking.customerName}">Name</td>
                    <td class="px-6 py-4 text-gray-600" th:text="${booking.location}">Location</td>
                    <td class="px-6 py-4 text-gray-600" th:text="${booking.phone}">Phone</td>
                    <td class="px-6 py-4" th:text="${#temporals.format(booking.pickupDate, 'MMM d, yyyy')}">Date</td>
                    <td class="px-6 py-4">
                        <form th:action="@{/admin/bookings/{id}/status(id=${booking.id})}" method="post" class="inline">
                            <select name="status" onchange="this.form.submit()" 
                                    th:class="${'px-2 py-1 rounded-full text-xs font-medium border-0 cursor-pointer ' + 
                                        (booking.status.name() == 'PENDING' ? 'bg-yellow-100 text-yellow-800' : 
                                        (booking.status.name() == 'CONFIRMED' ? 'bg-blue-100 text-blue-800' : 
                                        (booking.status.name() == 'COMPLETED' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800')))}">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" 
                                        th:selected="${s == booking.status}">Status</option>
                            </select>
                        </form>
                    </td>
                    <td class="px-6 py-4 font-semibold" th:text="${'$' + booking.totalAmount}">$0</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-2">
                            <a th:href="@{/admin/bookings/{id}(id=${booking.id})}" 
                               class="text-blue-600 hover:text-blue-800" title="View">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/admin/export/booking/{id}/receipt(id=${booking.id})}" 
                               class="text-green-600 hover:text-green-800" title="Download Receipt">
                                <i class="fas fa-download"></i>
                            </a>
                            <span sec:authorize="hasAnyRole('DEVELOPER', 'ADMIN')">
                                <a th:href="@{/admin/bookings/{id}/edit(id=${booking.id})}" 
                                   class="text-yellow-600 hover:text-yellow-800" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{/admin/bookings/{id}/delete(id=${booking.id})}" method="post" class="inline"
                                      onsubmit="return confirm('Are you sure you want to delete this booking?')">
                                    <button type="submit" class="text-red-600 hover:text-red-800" title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
