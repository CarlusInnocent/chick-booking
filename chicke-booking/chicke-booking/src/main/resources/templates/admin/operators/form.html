<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Add Operator</title>
</head>
<body>
<h1 layout:fragment="pageTitle">Add Operator</h1>
<main layout:fragment="content">
    <!-- Error Message -->
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}">Error</span>
    </div>

    <div class="max-w-xl">
        <div class="bg-white rounded-xl shadow p-6">
            <form th:action="@{/admin/operators/create}" method="post">
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Username *</label>
                    <input type="text" name="username" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
                           placeholder="Enter username">
                    <p class="text-gray-500 text-sm mt-1">Used for login</p>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Full Name *</label>
                    <input type="text" name="fullName" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
                           placeholder="Enter full name">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Password *</label>
                    <input type="password" name="password" required minlength="6"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
                           placeholder="Enter password">
                    <p class="text-gray-500 text-sm mt-1">Minimum 6 characters</p>
                </div>

                <div class="bg-yellow-50 p-4 rounded-lg mb-6">
                    <p class="text-yellow-800 text-sm">
                        <i class="fas fa-info-circle mr-2"></i>
                        Operators can <strong>view</strong> and <strong>create</strong> bookings, but cannot edit or delete them.
                    </p>
                </div>

                <div class="flex justify-end space-x-4">
                    <a href="/admin/operators" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition">
                        Cancel
                    </a>
                    <button type="submit" class="px-6 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition">
                        <i class="fas fa-save mr-2"></i> Create Operator
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
