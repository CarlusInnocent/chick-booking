<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Edit Operator</title>
</head>
<body>
<h1 layout:fragment="pageTitle">Edit Operator</h1>
<main layout:fragment="content">
    <!-- Error Message -->
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}">Error</span>
    </div>

    <div class="max-w-xl">
        <div class="bg-white rounded-xl shadow p-6 mb-6">
            <form th:action="@{/admin/operators/{id}/update(id=${operator.id})}" method="post">
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Username</label>
                    <input type="text" th:value="${operator.username}" disabled
                           class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-100 text-gray-500">
                    <p class="text-gray-500 text-sm mt-1">Username cannot be changed</p>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Full Name *</label>
                    <input type="text" name="fullName" required th:value="${operator.fullName}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                </div>

                <div class="mb-6">
                    <label class="flex items-center">
                        <input type="checkbox" name="enabled" th:checked="${operator.enabled}"
                               class="rounded border-gray-300 text-yellow-500 focus:ring-yellow-500">
                        <span class="ml-2 text-gray-700">Account Enabled</span>
                    </label>
                    <p class="text-gray-500 text-sm mt-1">Disabled accounts cannot log in</p>
                </div>

                <div class="flex justify-end space-x-4">
                    <a href="/admin/operators" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition">
                        Cancel
                    </a>
                    <button type="submit" class="px-6 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition">
                        <i class="fas fa-save mr-2"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>

        <!-- Reset Password -->
        <div class="bg-white rounded-xl shadow p-6">
            <h3 class="font-semibold text-gray-800 mb-4">Reset Password</h3>
            <form th:action="@{/admin/operators/{id}/reset-password(id=${operator.id})}" method="post">
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">New Password *</label>
                    <input type="password" name="newPassword" required minlength="6"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
                           placeholder="Enter new password">
                </div>
                <button type="submit" class="px-6 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
                    <i class="fas fa-key mr-2"></i> Reset Password
                </button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
