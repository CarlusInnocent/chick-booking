<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Operators</title>
</head>
<body>
<h1 layout:fragment="pageTitle">Operators</h1>
<main layout:fragment="content">
    <!-- Messages -->
    <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}">Success</span>
    </div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}">Error</span>
    </div>

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <p class="text-gray-600">Manage operators who can view and create bookings</p>
        <a href="/admin/operators/new" class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition">
            <i class="fas fa-plus mr-2"></i> Add Operator
        </a>
    </div>

    <!-- Operators Table -->
    <div class="bg-white rounded-xl shadow overflow-hidden">
        <div th:if="${#lists.isEmpty(operators)}" class="text-center py-12 text-gray-500">
            <i class="fas fa-users text-5xl mb-4"></i>
            <p class="text-xl">No operators yet</p>
            <a href="/admin/operators/new" class="text-yellow-600 hover:underline mt-2 inline-block">Add your first operator</a>
        </div>

        <table th:if="${not #lists.isEmpty(operators)}" class="w-full">
            <thead class="bg-gray-50">
                <tr class="text-left text-gray-600 text-sm">
                    <th class="px-6 py-4">ID</th>
                    <th class="px-6 py-4">Username</th>
                    <th class="px-6 py-4">Full Name</th>
                    <th class="px-6 py-4">Status</th>
                    <th class="px-6 py-4">Created</th>
                    <th class="px-6 py-4">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="operator : ${operators}" class="border-t hover:bg-gray-50">
                    <td class="px-6 py-4 text-gray-500" th:text="${operator.id}">#1</td>
                    <td class="px-6 py-4 font-medium" th:text="${operator.username}">username</td>
                    <td class="px-6 py-4" th:text="${operator.fullName}">Name</td>
                    <td class="px-6 py-4">
                        <span th:if="${operator.enabled}" class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-medium">Active</span>
                        <span th:unless="${operator.enabled}" class="bg-red-100 text-red-800 px-3 py-1 rounded-full text-xs font-medium">Disabled</span>
                    </td>
                    <td class="px-6 py-4 text-gray-500" th:text="${#temporals.format(operator.createdAt, 'MMM d, yyyy')}">Date</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-3">
                            <a th:href="@{/admin/operators/{id}/edit(id=${operator.id})}" 
                               class="text-yellow-600 hover:text-yellow-800" title="Edit">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/admin/operators/{id}/delete(id=${operator.id})}" method="post" class="inline"
                                  onsubmit="return confirm('Are you sure you want to delete this operator?')">
                                <button type="submit" class="text-red-600 hover:text-red-800" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
