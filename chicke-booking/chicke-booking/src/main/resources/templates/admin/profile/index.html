<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>My Profile</title>
</head>
<body>
<h1 layout:fragment="pageTitle">My Profile</h1>
<main layout:fragment="content">
    <!-- Success/Error Messages -->
    <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}">Success</span>
    </div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}">Error</span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Profile Information -->
        <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-6 pb-2 border-b">
                <i class="fas fa-user mr-2 text-yellow-500"></i> Profile Information
            </h2>
            
            <form th:action="@{/admin/profile/update}" method="post">
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Username</label>
                    <input type="text" th:value="${user.username}" disabled
                           class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-100 text-gray-500">
                    <p class="text-gray-500 text-sm mt-1">Username cannot be changed</p>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Role</label>
                    <input type="text" th:value="${user.role}" disabled
                           class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-100 text-gray-500">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Full Name *</label>
                    <input type="text" name="fullName" required th:value="${user.fullName}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Account Created</label>
                    <input type="text" th:value="${#temporals.format(user.createdAt, 'MMMM d, yyyy')}" disabled
                           class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-100 text-gray-500">
                </div>

                <button type="submit" class="w-full bg-yellow-500 text-white py-2 rounded-lg hover:bg-yellow-600 transition font-medium">
                    <i class="fas fa-save mr-2"></i> Update Profile
                </button>
            </form>
        </div>

        <!-- Change Password -->
        <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-6 pb-2 border-b">
                <i class="fas fa-key mr-2 text-red-500"></i> Change Password
            </h2>
            
            <form th:action="@{/admin/profile/change-password}" method="post">
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Current Password *</label>
                    <input type="password" name="currentPassword" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
                           placeholder="Enter current password">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">New Password *</label>
                    <input type="password" name="newPassword" required minlength="6"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
                           placeholder="Enter new password (min 6 characters)">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Confirm New Password *</label>
                    <input type="password" name="confirmPassword" required minlength="6"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
                           placeholder="Confirm new password">
                </div>

                <button type="submit" class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 transition font-medium">
                    <i class="fas fa-lock mr-2"></i> Change Password
                </button>
            </form>

            <div class="mt-6 p-4 bg-yellow-50 rounded-lg">
                <p class="text-sm text-yellow-800">
                    <i class="fas fa-info-circle mr-2"></i>
                    After changing your password, you will need to log in again with your new password.
                </p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
