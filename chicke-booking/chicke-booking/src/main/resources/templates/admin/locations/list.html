<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Locations</title>
</head>
<body>
<h1 layout:fragment="pageTitle">Delivery Locations</h1>
<main layout:fragment="content">
    <!-- Messages -->
    <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}">Success</span>
    </div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}">Error</span>
    </div>

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <p class="text-gray-600">Manage delivery locations and service areas</p>
        <div class="flex items-center gap-2">
            <a href="/admin/export/locations" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                <i class="fas fa-download mr-2"></i> Export PDF
            </a>
            <a href="/admin/locations/new" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">
                <i class="fas fa-plus mr-2"></i> Add Location
            </a>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(locations)}" class="bg-white rounded-xl shadow p-12 text-center text-gray-500">
        <i class="fas fa-map-marker-alt text-6xl text-gray-300 mb-4"></i>
        <p class="text-xl mt-4">No locations yet</p>
        <a href="/admin/locations/new" class="text-green-600 hover:underline mt-2 inline-block">Add your first location</a>
    </div>

    <!-- Locations Table -->
    <div th:if="${not #lists.isEmpty(locations)}" class="bg-white rounded-xl shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">District</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Region</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Coordinates</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                <tr th:each="location : ${locations}" class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 h-10 w-10 bg-green-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-map-marker-alt text-green-600"></i>
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900" th:text="${location.name}">Location Name</div>
                                <div class="text-sm text-gray-500 max-w-xs truncate" th:text="${location.description ?: 'No description'}">Description</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${location.district ?: '-'}">District</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${location.region ?: '-'}">Region</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span th:text="${#numbers.formatDecimal(location.latitude, 1, 4) + ', ' + #numbers.formatDecimal(location.longitude, 1, 4)}">0.0, 0.0</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span th:if="${location.contact != null}" th:text="${location.contact}">+256...</span>
                        <span th:unless="${location.contact != null}" class="text-gray-400">-</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span th:if="${location.active}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Active</span>
                        <span th:unless="${location.active}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Inactive</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <a th:href="@{/admin/locations/{id}/edit(id=${location.id})}" class="text-yellow-600 hover:text-yellow-900 mr-3" title="Edit">
                            <i class="fas fa-edit"></i>
                        </a>
                        <form th:action="@{/admin/locations/{id}/toggle-active(id=${location.id})}" method="post" class="inline">
                            <button type="submit" class="text-blue-600 hover:text-blue-900 mr-3" th:title="${location.active ? 'Deactivate' : 'Activate'}">
                                <i th:class="${location.active ? 'fas fa-toggle-on' : 'fas fa-toggle-off'}"></i>
                            </button>
                        </form>
                        <form th:action="@{/admin/locations/{id}/delete(id=${location.id})}" method="post" class="inline"
                              onsubmit="return confirm('Are you sure you want to delete this location?')">
                            <button type="submit" class="text-red-600 hover:text-red-900" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
