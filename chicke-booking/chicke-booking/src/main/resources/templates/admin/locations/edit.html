<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title>Edit Location</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .leaflet-container, .leaflet-pane, .leaflet-top, .leaflet-bottom {
            z-index: 10 !important;
        }
    </style>
</head>
<body>
<h1 layout:fragment="pageTitle">Edit Location</h1>
<main layout:fragment="content">
    <div class="max-w-4xl">
        <!-- Messages -->
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span th:text="${error}">Error</span>
        </div>

        <form th:action="@{/admin/locations/{id}/update(id=${location.id})}" method="post" class="bg-white rounded-xl shadow p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Location Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Location Name *</label>
                    <input type="text" name="name" required th:value="${location.name}"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                           placeholder="e.g., Kampala Central">
                </div>

                <!-- District -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">District</label>
                    <input type="text" name="district" th:value="${location.district}"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                           placeholder="e.g., Kampala">
                </div>

                <!-- Region -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Region</label>
                    <input type="text" name="region" th:value="${location.region}"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                           placeholder="e.g., Central">
                </div>

                <!-- Contact -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contact (Phone)</label>
                    <input type="text" name="contact" th:value="${location.contact}"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                           placeholder="e.g., +256 700 000 000">
                </div>

                <!-- Description -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea name="description" rows="2"
                              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                              placeholder="Brief description of this location..." th:text="${location.description}"></textarea>
                </div>

                <!-- Active Status -->
                <div class="md:col-span-2">
                    <label class="flex items-center">
                        <input type="checkbox" name="active" value="true" th:checked="${location.active}"
                               class="w-4 h-4 text-green-600 rounded focus:ring-green-500">
                        <span class="ml-2 text-sm text-gray-700">Active (available for customers)</span>
                    </label>
                </div>
            </div>

            <!-- Map Section -->
            <div class="mt-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-map-marker-alt mr-1"></i> Location on Map *
                </label>
                <div class="flex flex-wrap items-center gap-3 mb-3">
                    <p class="text-sm text-gray-500">Click on the map or drag the marker, or:</p>
                    <button type="button" onclick="useMyLocation()" 
                            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm">
                        <i class="fas fa-crosshairs mr-2"></i> Use My Current Location
                    </button>
                    <span id="locationStatus" class="text-sm text-gray-500 hidden">
                        <i class="fas fa-spinner fa-spin mr-1"></i> Getting location...
                    </span>
                </div>
                
                <div id="map" class="h-80 rounded-lg border border-gray-300 mb-4"></div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Latitude *</label>
                        <input type="number" name="latitude" id="latitude" step="any" required th:value="${location.latitude}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Longitude *</label>
                        <input type="number" name="longitude" id="longitude" step="any" required th:value="${location.longitude}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500">
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="mt-6 flex justify-end space-x-3">
                <a href="/admin/locations" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">
                    <i class="fas fa-save mr-2"></i> Update Location
                </button>
            </div>
        </form>
    </div>

    <script th:inline="javascript">
        // Get existing coordinates
        const existingLat = /*[[${location.latitude}]]*/ 0;
        const existingLng = /*[[${location.longitude}]]*/ 0;

        // Initialize map centered on existing location
        const map = L.map('map').setView([existingLat, existingLng], 12);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Create marker at existing position
        let marker = L.marker([existingLat, existingLng], {draggable: true}).addTo(map);
        
        marker.on('dragend', function(e) {
            const pos = marker.getLatLng();
            document.getElementById('latitude').value = pos.lat.toFixed(6);
            document.getElementById('longitude').value = pos.lng.toFixed(6);
        });

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            document.getElementById('latitude').value = lat.toFixed(6);
            document.getElementById('longitude').value = lng.toFixed(6);
            marker.setLatLng(e.latlng);
        });

        // Update marker when coordinates are manually entered
        document.getElementById('latitude').addEventListener('change', updateMarkerFromInputs);
        document.getElementById('longitude').addEventListener('change', updateMarkerFromInputs);

        function updateMarkerFromInputs() {
            const lat = parseFloat(document.getElementById('latitude').value);
            const lng = parseFloat(document.getElementById('longitude').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                const latlng = L.latLng(lat, lng);
                marker.setLatLng(latlng);
                map.setView(latlng, 12);
            }
        }

        function useMyLocation() {
            const status = document.getElementById('locationStatus');
            
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser');
                return;
            }

            status.classList.remove('hidden');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    document.getElementById('latitude').value = lat.toFixed(6);
                    document.getElementById('longitude').value = lng.toFixed(6);

                    const latlng = L.latLng(lat, lng);
                    marker.setLatLng(latlng);
                    map.setView(latlng, 15);
                    
                    status.classList.add('hidden');
                },
                (error) => {
                    status.classList.add('hidden');
                    let errorMessage = 'Unable to get your location. ';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage += 'Please allow location access.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage += 'Location information unavailable.';
                            break;
                        case error.TIMEOUT:
                            errorMessage += 'Location request timed out.';
                            break;
                    }
                    alert(errorMessage);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 300000
                }
            );
        }
    </script>
</main>
</body>
</html>
