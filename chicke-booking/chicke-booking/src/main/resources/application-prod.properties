# Production Configuration for Google Cloud Run
spring.application.name=chicke-booking

# Import GCP Secret Manager as a property source (required for sm:// placeholders)
spring.config.import=sm://

# PostgreSQL Database (Supabase Pooler) - Transaction mode for serverless
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-eu-north-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${DATABASE_USERNAME:postgres.prnhyufushxkxmxszysy}
spring.datasource.password=${sm://database-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings for cloud
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Configuration
# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Let Hibernate auto-detect dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration - Use environment variable
jwt.secret=${sm://jwt-secret}
jwt.expiration=86400000

# Thymeleaf Configuration
spring.thymeleaf.cache=true

# Server Configuration - Cloud Run uses PORT env variable
server.port=${PORT:8080}
server.error.whitelabel.enabled=false

# Trust forwarded headers from Cloud Run load balancer (fixes HTTPS redirect URLs)
server.forward-headers-strategy=framework

# Faster startup (important for cold starts)
spring.jpa.open-in-view=false
spring.main.lazy-initialization=true

# Zoho Mail SMTP Configuration
spring.mail.host=smtp.zoho.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:info@suubiagrovet.com}
spring.mail.password=${sm://mail-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Settings
app.mail.from=${MAIL_FROM:info@suubiagrovet.com}
app.mail.from-name=Suubi Agrovet LTD
app.mail.admin-email=${ADMIN_EMAIL:info@suubiagrovet.com}

# PesaPal Configuration - Secrets from GCP Secret Manager
# In Cloud Run, set these via: gcloud run services update <service> --set-secrets=PESAPAL_CONSUMER_KEY=pesapal-consumer-key:latest,PESAPAL_CONSUMER_SECRET=pesapal-consumer-secret:latest
pesapal.consumer-key=${sm://pesapal-consumer-key}
pesapal.consumer-secret=${sm://pesapal-consumer-secret}
pesapal.api-url=https://pay.pesapal.com/v3
pesapal.callback-url=${APP_BASE_URL:https://your-app.run.app}/payment/callback
pesapal.ipn-url=${APP_BASE_URL:https://your-app.run.app}/payment/ipn

# Enable GCP Secret Manager
spring.cloud.gcp.secretmanager.enabled=true
