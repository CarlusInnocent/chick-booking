# Production Configuration for Google Cloud Run
spring.application.name=chicke-booking

# PostgreSQL Database (Supabase Pooler) - Transaction mode for serverless
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-eu-north-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${DATABASE_USERNAME:postgres.prnhyufushxkxmxszysy}
spring.datasource.password=${DATABASE_PASSWORD:Jb!EfG%ieL3Fc,F}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings for cloud
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Configuration
# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Let Hibernate auto-detect dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration - Use environment variable
jwt.secret=${JWT_SECRET:Y2hpY2tlLWJvb2tpbmctc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tMjAyNg==}
jwt.expiration=86400000

# Thymeleaf Configuration
spring.thymeleaf.cache=true

# Server Configuration - Cloud Run uses PORT env variable
server.port=${PORT:8080}
server.error.whitelabel.enabled=false

# Trust forwarded headers from Cloud Run load balancer (fixes HTTPS redirect URLs)
server.forward-headers-strategy=framework

# Faster startup (important for cold starts)
spring.jpa.open-in-view=false
spring.main.lazy-initialization=true

