spring.application.name=chicke-booking
# PostgreSQL Database Configuration (Supabase Pooler)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-eu-north-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${DATABASE_USERNAME:postgres.prnhyufushxkxmxszysy}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Server Configuration
server.port=8081
server.error.whitelabel.enabled=false

# Zoho Mail SMTP Configuration
spring.mail.host=smtp.zoho.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:info@suubiagrovet.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Settings
app.mail.from=${MAIL_FROM:info@suubiagrovet.com}
app.mail.from-name=Suubi Agrovet LTD
app.mail.admin-email=${ADMIN_EMAIL:info@suubiagrovet.com}

# PesaPal Configuration (sandbox for local dev)
pesapal.consumer-key=${PESAPAL_CONSUMER_KEY:}
pesapal.consumer-secret=${PESAPAL_CONSUMER_SECRET:}
pesapal.api-url=https://cybqa.pesapal.com/pesapalv3
pesapal.callback-url=http://localhost:8081/payment/callback
pesapal.ipn-url=http://localhost:8081/payment/ipn